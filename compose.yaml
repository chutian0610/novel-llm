# Novel LLM local stack (ADR-0005): only the web interface is published to the
# host (127.0.0.1). API, Worker, database, and storage stay on the internal
# Docker network.
name: novel-llm

services:
  postgres:
    build: ./docker/postgres
    image: novel-llm-postgres:16
    environment:
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
      POSTGRES_DB: novel_llm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d novel_llm"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: novel-llm-api:dev
    command: >
      sh -c "uv run --no-sync python -m novel_llm.migrate
      && uv run --no-sync uvicorn --factory novel_llm.api.app:create_app --host 0.0.0.0 --port 8000"
    volumes:
      - storage:/var/lib/novel-llm/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  worker:
    image: novel-llm-api:dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run --no-sync python -m novel_llm.worker.main
    volumes:
      - storage:/var/lib/novel-llm/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    build: ./frontend
    image: novel-llm-web:dev
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  storage:
