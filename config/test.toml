# Test profile (ADR-0002): layered over default.toml and deliberately ignores
# config/local.toml, so tests never depend on one machine's overrides.
# The database is published on 127.0.0.1 by compose.test.yaml.

[database]
url = "postgresql+asyncpg://novel:novel@127.0.0.1:5432/novel_llm_test"

[storage]
path = "/tmp/novel-llm-test-storage"

[log]
level = "WARNING"
