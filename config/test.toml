# Test profile (ADR-0002): layered over default.toml and deliberately ignores
# config/local.toml, so tests never depend on one machine's overrides.
# The database is published on 127.0.0.1:5433 by compose.test.yaml (the test
# compose project runs separately from the main stack).

[database]
url = "postgresql+asyncpg://novel:novel@127.0.0.1:5433/novel_llm_test"

[storage]
path = "/tmp/novel-llm-test-storage"

[log]
level = "WARNING"

[worker]
# Fast polling and a short graceful timeout so runtime tests stay quick.
poll_seconds = 0.05
graceful_timeout_seconds = 1.0
